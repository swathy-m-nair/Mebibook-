{% extends "layout.html" %}
{% block title %}Register - MediBook{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-box" style="max-width: 500px;">
        <div class="auth-header">
            <div class="auth-icon">&#128221;</div>
            <h2>Create Account</h2>
            <p>Fill in your details to register</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" name="name" placeholder="John Doe" required pattern="[A-Za-z]+(?: [A-Za-z]+)*" title="">
            </div>

            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <input type="email" name="email" placeholder="john@email.com" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" placeholder="10 digit number" pattern="[0-9]{10}" title="Enter a 10 digit phone number.">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender">
                        <option value="">Select</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <input type="password" name="password" placeholder="Min 6 characters" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Confirm Password <span class="required">*</span></label>
                    <input type="password" name="confirm" placeholder="Repeat password" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn btn-blue btn-block">Create Account</button>
        </form>

        <div class="auth-note">
            You can register directly with any test email address. Email verification is not required.
        </div>

        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('login') }}">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
